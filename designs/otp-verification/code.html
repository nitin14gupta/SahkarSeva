<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>
  @layer base {
    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
    }
    body {
      overscroll-behavior-y: none;
      -webkit-tap-highlight-color: transparent;
    }
    .pb-safe {
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    .pt-safe {
      padding-top: env(safe-area-inset-top, 0px);
    }
  }
  ::-webkit-scrollbar {
    display: none;
  }

  /* Core Keyframe Animations for Enriched Visual Experience */
  @keyframes morphBlob {
    0%, 100% {
      border-radius: 44% 56% 65% 35% / 40% 48% 52% 60%;
      transform: translate(0, 0) rotate(0deg) scale(1);
    }
    33% {
      border-radius: 65% 35% 42% 58% / 58% 32% 68% 42%;
      transform: translate(25px, -30px) rotate(120deg) scale(1.1);
    }
    66% {
      border-radius: 38% 62% 60% 40% / 46% 64% 36% 54%;
      transform: translate(-20px, 20px) rotate(240deg) scale(0.95);
    }
  }

  @keyframes floatSlow1 {
    0%, 100% {
      transform: translate(0px, 0px) scale(1);
    }
    50% {
      transform: translate(35px, -45px) scale(1.12);
    }
  }

  @keyframes floatSlow2 {
    0%, 100% {
      transform: translate(0px, 0px) scale(1);
    }
    50% {
      transform: translate(-40px, 35px) scale(1.15);
    }
  }

  @keyframes floatSlow3 {
    0%, 100% {
      transform: translate(0px, 0px) scale(0.95);
    }
    50% {
      transform: translate(25px, 40px) scale(1.1);
    }
  }

  @keyframes waveShift1 {
    0% {
      transform: translateX(0) translateY(0) scaleY(1);
    }
    50% {
      transform: translateX(-40px) translateY(12px) scaleY(1.08);
    }
    100% {
      transform: translateX(0) translateY(0) scaleY(1);
    }
  }

  @keyframes waveShift2 {
    0% {
      transform: translateX(0) translateY(0) scaleY(1);
    }
    50% {
      transform: translateX(35px) translateY(-14px) scaleY(0.92);
    }
    100% {
      transform: translateX(0) translateY(0) scaleY(1);
    }
  }

  @keyframes pulseGlow {
    0%, 100% {
      opacity: 0.35;
      transform: scale(0.92);
    }
    50% {
      opacity: 0.85;
      transform: scale(1.08);
    }
  }

  @keyframes radialRipple {
    0% {
      transform: translate(-50%, -50%) scale(0.75);
      opacity: 0.8;
    }
    50% {
      transform: translate(-50%, -50%) scale(1.12);
      opacity: 0.35;
    }
    100% {
      transform: translate(-50%, -50%) scale(1.35);
      opacity: 0;
    }
  }

  @keyframes orbitClockwise {
    from {
      transform: translate(-50%, -50%) rotate(0deg);
    }
    to {
      transform: translate(-50%, -50%) rotate(360deg);
    }
  }

  @keyframes orbitCounterClockwise {
    from {
      transform: translate(-50%, -50%) rotate(360deg);
    }
    to {
      transform: translate(-50%, -50%) rotate(0deg);
    }
  }

  @keyframes twinkleConstellation {
    0%, 100% {
      opacity: 0.2;
      transform: scale(0.85);
    }
    50% {
      opacity: 0.9;
      transform: scale(1.2);
    }
  }

  @keyframes driftOrbUpward {
    0% {
      transform: translateY(0px) translateX(0px) scale(0.9);
      opacity: 0.4;
    }
    50% {
      transform: translateY(-40px) translateX(25px) scale(1.15);
      opacity: 0.85;
    }
    100% {
      transform: translateY(-80px) translateX(-15px) scale(0.95);
      opacity: 0.45;
    }
  }

  @keyframes heroSpinPulse {
    0% {
      transform: translate(-50%, -50%) rotate(0deg) scale(0.95);
    }
    50% {
      transform: translate(-50%, -50%) rotate(180deg) scale(1.15);
    }
    100% {
      transform: translate(-50%, -50%) rotate(360deg) scale(0.95);
    }
  }

  /* Utility animation trigger classes */
  .animate-morph-blob {
    animation: morphBlob 16s ease-in-out infinite;
    will-change: transform, border-radius;
  }
  .animate-float-1 {
    animation: floatSlow1 18s ease-in-out infinite;
    will-change: transform;
  }
  .animate-float-2 {
    animation: floatSlow2 22s ease-in-out infinite;
    will-change: transform;
  }
  .animate-float-3 {
    animation: floatSlow3 15s ease-in-out infinite;
    will-change: transform;
  }
  .animate-wave-1 {
    animation: waveShift1 14s ease-in-out infinite;
    will-change: transform;
  }
  .animate-wave-2 {
    animation: waveShift2 18s ease-in-out infinite;
    will-change: transform;
  }
  .animate-pulse-glow {
    animation: pulseGlow 6s ease-in-out infinite;
    will-change: opacity, transform;
  }
  .animate-ripple-1 {
    animation: radialRipple 9s cubic-bezier(0.2, 0.8, 0.4, 1) infinite;
    will-change: transform, opacity;
  }
  .animate-ripple-2 {
    animation: radialRipple 9s cubic-bezier(0.2, 0.8, 0.4, 1) infinite 3s;
    will-change: transform, opacity;
  }
  .animate-ripple-3 {
    animation: radialRipple 9s cubic-bezier(0.2, 0.8, 0.4, 1) infinite 6s;
    will-change: transform, opacity;
  }
  .animate-orbit-cw {
    animation: orbitClockwise 42s linear infinite;
    will-change: transform;
  }
  .animate-orbit-ccw {
    animation: orbitCounterClockwise 52s linear infinite;
    will-change: transform;
  }
  .animate-drift-orb {
    animation: driftOrbUpward 12s ease-in-out infinite alternate;
    will-change: transform, opacity;
  }
  .animate-twinkle {
    animation: twinkleConstellation 5s ease-in-out infinite alternate;
    will-change: opacity, transform;
  }
  .animate-hero-spin-pulse {
    animation: heroSpinPulse 18s ease-in-out infinite;
    will-change: transform;
  }

  @media (prefers-reduced-motion: reduce) {
    .animate-morph-blob,
    .animate-float-1,
    .animate-float-2,
    .animate-float-3,
    .animate-wave-1,
    .animate-wave-2,
    .animate-pulse-glow,
    .animate-ripple-1,
    .animate-ripple-2,
    .animate-ripple-3,
    .animate-orbit-cw,
    .animate-orbit-ccw,
    .animate-drift-orb,
    .animate-twinkle,
    .animate-hero-spin-pulse {
      animation: none !important;
    }
  }

  .glass-card {
    background: rgba(255, 255, 255, 0.88);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid rgba(255, 255, 255, 0.95);
  }

  .glass-pill {

    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.95);
  }

<script>
  (function () {
    const inputs = document.querySelectorAll('.otp-box');
    inputs.forEach((input, index) => {
      input.addEventListener('input', (e) => {
        if (e.target.value.length === 1 && index < inputs.length - 1) {
          inputs[index + 1].focus();
        }
      });
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !e.target.value && index > 0) {
          inputs[index - 1].focus();
        }
      });
    });

    let seconds = 20;
    const countdownEl = document.getElementById('countdown');
    const timerWrapper = document.getElementById('timer-wrapper');
    const resendActions = document.getElementById('resend-actions');

    const timer = setInterval(() => {
      seconds--;
      if (seconds >= 0) {
        countdownEl.textContent = `0:${seconds < 10 ? '0' : ''}${seconds}`;
      } else {
        clearInterval(timer);
        if (timerWrapper) timerWrapper.classList.add('hidden');
        if (resendActions) resendActions.classList.remove('hidden');
      }
    }, 1000);
  })();
</script></main>
